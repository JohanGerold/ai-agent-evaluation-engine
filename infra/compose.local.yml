# Synthetic loopback PostgreSQL only. No production topology or later-task roles.
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_USER: aap_bootstrap
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - aap_local_pg18:/var/lib/postgresql
      - ./local-init.sql:/docker-entrypoint-initdb.d/local-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aap_bootstrap -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 15
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
volumes:
  aap_local_pg18:
